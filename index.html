<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0720">
<title>טביליסי נייטס • החבר'ה בגאורגיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600;700;900&family=Monoton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --night:#0f0720; --night2:#160a2b; --panel:#1c1033; --panel2:#241542;
    --text:#f4ecff; --text2:#cdc2e8; --dim:#9a8fc0;
    --neon:#ff2e88; --neon-soft:#ff6bab; --cyan:#22e0d6; --gold:#f5c542; --wine:#e0245e; --purple:#a259ff; --lime:#c6f24e;
    --line:rgba(162,89,255,.24);
    --disp:'Secular One',sans-serif; --body:'Rubik',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--body);color:var(--text);background:var(--night);min-height:100vh;
    padding-bottom:92px;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;line-height:1.55}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:radial-gradient(820px 560px at 8% -5%, rgba(255,46,136,.20), transparent 60%),
      radial-gradient(760px 620px at 100% 8%, rgba(34,224,214,.16), transparent 58%),
      radial-gradient(720px 720px at 50% 112%, rgba(162,89,255,.20), transparent 60%),
      linear-gradient(165deg,#0f0720,#160a2b 55%,#0c0518);}
  h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.12;font-weight:400}

  header{position:relative;padding:30px 16px 22px;text-align:center;overflow:hidden}
  .neon-sign{font-family:'Monoton',cursive;font-size:15px;letter-spacing:3px;color:var(--cyan);
    text-shadow:0 0 8px rgba(34,224,214,.9),0 0 20px rgba(34,224,214,.5);animation:flick 4s infinite}
  @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.5}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
  .hero-title{font-size:52px;color:#fff;margin:6px 0 2px;letter-spacing:1px;
    text-shadow:0 0 10px rgba(255,46,136,.9),0 0 26px rgba(255,46,136,.6),0 0 48px rgba(255,46,136,.35)}
  .hero-sub{font-size:14px;color:var(--text2);font-weight:600;margin-top:4px}
  .hero-crew{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .chip-name{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:20px;background:rgba(162,89,255,.14);
    border:1px solid rgba(162,89,255,.45);color:#e6dbff}
  .dates-pill{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 16px;border-radius:30px;
    background:rgba(245,197,66,.12);border:1px solid rgba(245,197,66,.5);color:var(--gold);font-weight:700;font-size:13px}

  .round-btn{margin:16px auto 0;display:block;border:none;cursor:pointer;font-family:var(--body);font-weight:800;font-size:14px;
    color:#0f0720;background:linear-gradient(135deg,var(--gold),#ffdd6e);padding:11px 20px;border-radius:30px;
    box-shadow:0 0 18px rgba(245,197,66,.5);transition:transform .15s}
  .round-btn:active{transform:scale(.96)}
  .round-result{margin:12px auto 0;max-width:340px;text-align:center;font-weight:800;font-size:15px;color:var(--gold);
    min-height:22px;text-shadow:0 0 12px rgba(245,197,66,.6)}

  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,#0a0416,#160a2b);border-top:1px solid rgba(255,46,136,.4);box-shadow:0 -8px 26px rgba(0,0,0,.6);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;min-width:64px;background:none;border:none;color:var(--dim);font-family:var(--body);font-weight:700;font-size:11px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 9px 5px;transition:.18s;position:relative;border-radius:14px}
  .tab svg{width:22px;height:22px}
  .pdf-btn{display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;font-family:var(--body);font-weight:800;font-size:14px;
    color:#0f0720;background:linear-gradient(135deg,var(--gold),#ffdd6e);padding:11px 16px;border-radius:12px;box-shadow:0 0 16px rgba(245,197,66,.4);margin-top:12px}
  .pdf-btn:active{transform:scale(.97)}
  .host-msg{background:rgba(34,224,214,.06);border:1px solid rgba(34,224,214,.28);border-radius:12px;padding:12px 14px;margin-top:10px;
    font-size:13px;color:var(--text2);line-height:1.6;font-style:italic}
  .host-msg .sig{color:var(--cyan);font-weight:800;font-style:normal}
  .contact-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .cbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:13px;padding:9px 14px;border-radius:11px;color:#fff}
  .cbtn.wa{background:#25d366;color:#08210f}
  .cbtn.tg{background:#2aabee}
  .cbtn.tel{background:rgba(162,89,255,.2);border:1px solid var(--line);color:#e6dbff}
  .tab.active{color:var(--neon);background:rgba(255,46,136,.12)}
  .tab.active svg{filter:drop-shadow(0 0 6px rgba(255,46,136,.8))}
  .tab.active::before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;
    background:var(--neon);box-shadow:0 0 10px var(--neon)}

  main{padding:16px 14px 10px;max-width:680px;margin:0 auto}
  .view{display:none;animation:fade .3s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .sec-title{font-family:var(--disp);font-size:26px;color:#fff;margin:6px 2px 6px;display:flex;align-items:center;gap:10px}
  .sec-title .bar{width:5px;height:24px;border-radius:3px;background:linear-gradient(var(--neon),var(--purple));box-shadow:0 0 12px rgba(255,46,136,.6)}
  .sec-sub{font-size:13px;color:var(--dim);margin:0 4px 14px}

  .day{position:relative;background:linear-gradient(165deg,var(--panel),var(--night2));border:1px solid var(--line);
    border-radius:20px;margin-bottom:18px;overflow:hidden;box-shadow:0 14px 38px rgba(0,0,0,.5)}
  .day::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--neon),var(--cyan),transparent);opacity:.7}
  .day-head{display:flex;align-items:center;gap:13px;padding:16px;border-bottom:1px solid var(--line)}
  .daynum{flex:0 0 auto;width:54px;height:54px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
    background:linear-gradient(140deg,var(--neon),var(--purple));color:#fff;box-shadow:0 0 18px rgba(255,46,136,.5)}
  .daynum .dn{font-family:var(--disp);font-size:24px}
  .daynum .dl{font-size:9px;font-weight:800;letter-spacing:1px;opacity:.85;margin-top:2px}
  .day-head .meta{flex:1;min-width:0}
  .day-head .wd{font-family:var(--disp);font-size:20px;color:#fff}
  .day-head .tagline{font-size:12.5px;color:var(--cyan);font-weight:600}
  .vibe{flex:0 0 auto;font-size:20px}

  .tl{padding:6px 0 8px}
  .tlrow{display:flex;gap:12px;padding:9px 16px;align-items:flex-start;position:relative}
  .tlrow .tt{flex:0 0 auto;font-family:var(--disp);font-size:15px;color:var(--gold);width:52px;padding-top:1px;text-shadow:0 0 8px rgba(245,197,66,.4)}
  .tlrow .tbody{flex:1;min-width:0}
  .tlrow .th{font-weight:700;font-size:15px;color:#fff}
  .tlrow .td{font-size:12.5px;color:var(--text2);margin-top:2px;line-height:1.5}
  .tlchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;display:inline-flex;gap:4px;align-items:center;border:1px solid transparent}
  .chip.price{background:rgba(198,242,78,.12);color:var(--lime);border-color:rgba(198,242,78,.3)}
  .chip.tag{background:rgba(34,224,214,.12);color:var(--cyan);border-color:rgba(34,224,214,.3)}
  .chip.must{background:rgba(255,46,136,.15);color:var(--neon-soft);border-color:rgba(255,46,136,.4)}
  .maplink{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;font-weight:700;
    color:#0f0720;background:linear-gradient(135deg,var(--cyan),#5ff0e6);padding:6px 12px;border-radius:10px;text-decoration:none}
  .maplink:active{transform:scale(.96)}
  .maplink svg{width:13px;height:13px}

  .card{background:linear-gradient(165deg,var(--panel),var(--night2));border:1px solid var(--line);border-radius:18px;
    padding:16px;margin-bottom:13px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .card h3{font-family:var(--disp);font-size:19px;color:#fff;margin-bottom:2px}
  .card .place-sub{font-size:12px;font-weight:700;color:var(--cyan);margin-bottom:8px}
  .card p{font-size:13.5px;color:var(--text2);margin:0 0 4px;line-height:1.55}
  .place-chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0}
  .badge{position:absolute;top:14px;left:14px;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:20px;
    background:linear-gradient(135deg,var(--neon),var(--purple));color:#fff;box-shadow:0 0 14px rgba(255,46,136,.5)}
  .card{position:relative}

  .infobox{background:rgba(34,224,214,.07);border:1px solid rgba(34,224,214,.25);border-inline-start:3px solid var(--cyan);
    border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--text2);margin:0 2px 14px;line-height:1.6}
  .infobox.gold{background:rgba(245,197,66,.08);border-color:rgba(245,197,66,.3);border-inline-start-color:var(--gold)}
  .infobox b{color:#fff}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
  .kv:first-of-type{border-top:none}
  .kv .k{color:var(--dim);font-weight:600}
  .kv .v{text-align:start;font-weight:700;color:#fff}

  .crew-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .crew-card{background:rgba(162,89,255,.1);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
  .crew-av{width:46px;height:46px;margin:0 auto 7px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-size:19px;color:#fff}
  .crew-name{font-size:13px;font-weight:700;color:#fff}

  a.inline{color:var(--cyan);font-weight:700}
  .cd-line{font-size:13.5px;font-weight:700;color:var(--text2);margin-top:16px}
  .cd-line b{color:var(--neon)}
  .cd-clock{direction:ltr;display:flex;align-items:flex-start;justify-content:center;gap:7px;margin-top:9px}
  .cd-cell{min-width:60px;padding:9px 6px 7px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:linear-gradient(160deg,#241542,#160a2b);border:1px solid rgba(245,197,66,.45);
    box-shadow:0 0 16px rgba(245,197,66,.18),inset 0 1px 0 rgba(255,255,255,.08)}
  .cd-num{font-family:var(--disp);font-size:30px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;
    text-shadow:0 0 10px rgba(245,197,66,.7)}
  .cd-lab{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--dim)}
  .cd-sep{font-family:var(--disp);font-size:26px;color:var(--neon);opacity:.8;margin-top:8px;text-shadow:0 0 8px var(--neon)}
  .dates-line{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:10px;letter-spacing:.5px}

  #map{width:100%;height:64vh;min-height:400px;border-radius:18px;border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 2px 0;font-size:12.5px;font-weight:700;color:var(--text2)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .mk{width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;
    font-size:15px;box-shadow:0 2px 9px rgba(0,0,0,.6),0 0 12px rgba(255,255,255,.2);position:relative}
  .leaflet-popup-content-wrapper{background:#1c1033;color:var(--text);border:1px solid var(--line);border-radius:12px}
  .leaflet-popup-tip{background:#1c1033}
  .leaflet-popup-content{font-family:var(--body);direction:rtl;text-align:right;margin:11px 13px;color:var(--text)}
  .leaflet-container a.leaflet-popup-close-button{color:var(--dim)}
  .pop-nav{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--cyan);text-decoration:none}

  .fl-card{background:linear-gradient(165deg,var(--panel),var(--night2));border:1px solid var(--line);border-radius:18px;
    padding:16px;margin-bottom:13px;box-shadow:0 12px 30px rgba(0,0,0,.45);position:relative}
  .fl-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:#fff;margin-bottom:10px}
  .fl-code{font-family:var(--disp);color:var(--cyan);text-shadow:0 0 8px rgba(34,224,214,.5)}
  .fl-route{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
  .fl-ap{text-align:center}
  .fl-time{font-family:var(--disp);font-size:26px;color:var(--gold);text-shadow:0 0 10px rgba(245,197,66,.4)}
  .fl-city{font-size:11.5px;color:var(--dim);font-weight:700;margin-top:2px}
  .fl-mid{flex:1;text-align:center;color:var(--neon);font-size:11px;font-weight:700}
  .fl-mid .dur{color:var(--dim)}
  .fl-line{height:2px;background:linear-gradient(90deg,var(--cyan),var(--neon));border-radius:2px;margin:4px 6px;position:relative}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .fbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:12.5px;padding:8px 13px;border-radius:11px;color:#0f0720}
  .fbtn.live{background:linear-gradient(135deg,var(--cyan),#5ff0e6)}
  .fbtn.g{background:linear-gradient(135deg,var(--gold),#ffdd6e)}
  .fbtn.area{background:linear-gradient(135deg,var(--neon),var(--purple));color:#fff}
  .pax{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pax span{font-size:11.5px;font-weight:700;background:rgba(162,89,255,.12);border:1px solid var(--line);color:#e6dbff;padding:4px 10px;border-radius:20px}
  .exf{display:flex;flex-direction:column;gap:10px}
  .exf label{font-size:12px;font-weight:700;color:var(--dim);margin-bottom:-4px}
  .exf input,.exf select{font-family:var(--body);font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);color:var(--text);width:100%}
  .exf input::placeholder{color:var(--dim)}
  .exf input:focus,.exf select:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(255,46,136,.16)}
  .exf .row2{display:flex;gap:9px}.exf .row2>div{flex:1}
  .ex-add{background:linear-gradient(135deg,var(--neon),var(--purple));color:#fff;border:none;font-family:var(--body);font-weight:800;font-size:15px;padding:13px;border-radius:12px;cursor:pointer;margin-top:2px;box-shadow:0 0 18px rgba(255,46,136,.4)}
  .ex-add:active{transform:scale(.98)}
  .ex-sum{background:linear-gradient(140deg,#241542,#160a2b);border:1px solid rgba(245,197,66,.42);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 0 0 1px rgba(245,197,66,.1) inset,0 12px 30px rgba(0,0,0,.5)}
  .ex-sum .big{font-family:var(--disp);font-size:34px;color:var(--gold);text-shadow:0 0 12px rgba(245,197,66,.5)}
  .ex-sum .s2{font-size:14px;color:var(--text2);font-weight:600;margin-top:2px}
  .ex-row{display:flex;align-items:flex-start;gap:10px;background:linear-gradient(165deg,var(--panel),var(--night2));border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px}
  .ex-row .exdt{flex:0 0 auto;font-family:var(--disp);font-size:13px;color:var(--gold);width:44px;line-height:1.25}
  .ex-row .exmid{flex:1;min-width:0}.ex-row .exnm{font-weight:700;font-size:14.5px;color:#fff}.ex-row .exnote{font-size:12px;color:var(--dim);margin-top:2px}
  .ex-row .examt{flex:0 0 auto;font-weight:800;font-size:14px;color:var(--cyan)}
  .ex-row .exdel{flex:0 0 auto;background:none;border:none;color:#ff6b8a;font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
  .ex-empty{text-align:center;color:var(--dim);font-size:13px;padding:24px 10px}
  .split-chips{display:flex;flex-wrap:wrap;gap:7px}
  .sp-chip{font-family:var(--body);font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:20px;cursor:pointer;
    border:1px solid var(--neon);background:rgba(255,46,136,.14);color:#ffd0e4;transition:.15s}
  .sp-chip.off{opacity:.35;border-color:var(--line);background:rgba(255,255,255,.04);color:var(--dim);text-decoration:line-through}
  .bal-row{display:flex;flex-wrap:wrap;gap:7px}
  .bal{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:20px;border:1px solid transparent}
  .bal.pos{background:rgba(198,242,78,.14);color:var(--lime);border-color:rgba(198,242,78,.35)}
  .bal.neg{background:rgba(224,36,94,.16);color:#ff7a9c;border-color:rgba(224,36,94,.4)}
  .tx-row{display:flex;align-items:center;gap:8px;padding:9px 11px;margin-bottom:7px;border-radius:11px;
    background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .tx-from{font-weight:800;color:#ff7a9c}
  .tx-arr{color:var(--gold);font-weight:800}
  .tx-to{font-weight:800;color:var(--lime)}
  .tx-amt{margin-inline-start:auto;font-weight:800;color:#fff;font-size:13.5px}
  .daypills{position:sticky;top:0;z-index:30;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    padding:10px 2px;margin:0 -2px 10px;background:rgba(15,7,32,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .daypills::-webkit-scrollbar{display:none}
  .dpill{flex:0 0 auto;min-width:54px;text-align:center;padding:7px 11px;border-radius:14px;cursor:pointer;line-height:1.15;
    background:rgba(255,46,136,.08);border:1px solid var(--line);transition:.18s}
  .dpill .dpd{font-family:var(--disp);font-size:17px;color:#fff;display:block}
  .dpill .dpw{font-size:10px;color:var(--dim);font-weight:700}
  .dpill.active{background:linear-gradient(135deg,var(--neon),var(--purple));border-color:var(--neon);box-shadow:0 6px 16px rgba(255,46,136,.4)}
  .dpill.active .dpw{color:#ffd0e4}
</style>
</head>
<body>

<header>
  <div class="neon-sign">TBILISI · GEORGIA</div>
  <h1 class="hero-title">טביליסי נייטס</h1>
  <div class="hero-sub">6 חבר'ה · ברים · קזינו · אדרנלין 🎲🍷</div>
  <div class="hero-crew" id="crew-chips"></div>
  <div class="cd-line">🧳 ישיבות חשובות מאוד בטביליסי מתחילות בעוד:</div>
  <div class="cd-clock">
    <div class="cd-cell"><span class="cd-num" id="cd-d">00</span><span class="cd-lab">ימים</span></div>
    <span class="cd-sep">:</span>
    <div class="cd-cell"><span class="cd-num" id="cd-h">00</span><span class="cd-lab">שעות</span></div>
    <span class="cd-sep">:</span>
    <div class="cd-cell"><span class="cd-num" id="cd-m">00</span><span class="cd-lab">דקות</span></div>
    <span class="cd-sep">:</span>
    <div class="cd-cell"><span class="cd-num" id="cd-s">00</span><span class="cd-lab">שניות</span></div>
  </div>
  <div class="dates-line" id="dates-line">🗓️ 19–23 בנובמבר 2026 · 4 לילות</div>
  <button class="round-btn" onclick="whoBuys()">🎲 מי קונה את הסיבוב הבא?</button>
  <div class="round-result" id="round-result"></div>

function chipsHtml(chips){return (chips||[]).map(c=>'<span class="chip '+c[0]+'">'+(c[0]==='price'?'💵 ':c[0]==='must'?'⭐ ':'')+c[1]+'</span>').join('');}

function renderPlan(){
  const v=document.getElementById('view-plan');
  let pills='<div class="daypills" id="daypills">';
  DAYS.forEach(day=>{const dd=day.date.split('.')[0];const ws=day.wd.replace('יום ','').replace('שבת','ש׳');
    pills+='<div class="dpill" data-d="'+day.n+'" onclick="goGDay('+day.n+')"><span class="dpd">'+dd+'</span><span class="dpw">'+ws+'</span></div>';});
  pills+='</div>';
  let html='<h2 class="sec-title"><span class="bar"></span>הלו״ז</h2>'+
    '<p class="sec-sub">19–23 בנובמבר 2026 · 4 לילות בטביליסי. הקישו על יום למעלה כדי לקפוץ אליו. 🎲</p>'+pills;
  DAYS.forEach(day=>{
    let rows='';
    day.rows.forEach(r=>{
      rows+='<div class="tlrow"><div class="tt">'+r.t+'</div><div class="tbody"><div class="th">'+r.h+'</div>'+
        (r.d?'<div class="td">'+r.d+'</div>':'')+
        (r.chips?'<div class="tlchips">'+chipsHtml(r.chips)+'</div>':'')+
        (r.map?mapBtn(r.map):'')+'</div></div>';
    });
    const dd=day.date.split('.')[0];
    html+='<div class="day" id="gday-'+day.n+'"><div class="day-head"><div class="daynum"><span class="dn">'+dd+'</span><span class="dl">נוב׳</span></div>'+
      '<div class="meta"><div class="wd">'+day.wd+' · '+day.title+'</div><div class="tagline">'+day.tag+'</div></div><div class="vibe">'+day.vibe+'</div></div>'+
      '<div class="tl">'+rows+'</div></div>';
  });
  v.innerHTML=html;
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const n=e.target.id.split('-')[1];
    document.querySelectorAll('.dpill').forEach(p=>p.classList.toggle('active',p.dataset.d===n));}});},{rootMargin:'-30% 0px -60% 0px'});
  DAYS.forEach(day=>{const el=document.getElementById('gday-'+day.n);if(el)io.observe(el);});
}
function goGDay(n){const el=document.getElementById('gday-'+n);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.dpill').forEach(p=>p.classList.toggle('active',p.dataset.d==n));}

function tick(){
  const diff=TRIP_START-new Date();
  const set=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=pad(val);};
  if(diff<=0){set('cd-d',0);set('cd-h',0);set('cd-m',0);set('cd-s',0);
    const l=document.querySelector('.cd-line');if(l)l.innerHTML='🎉 הישיבות בטביליסי בעיצומן!';return;}
  const s=Math.floor(diff/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
  set('cd-d',d);set('cd-h',h);set('cd-m',m);set('cd-s',sec);
}

function openDoc(id){
  try{const b64=(window.TDATA||{})[id];if(!b64){alert('הקובץ לא נמצא');return;}
    const bin=atob(b64),len=bin.length,arr=new Uint8Array(len);for(let i=0;i<len;i++)arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));
    const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download=id+'.pdf';document.body.appendChild(a);a.click();a.remove();}
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }catch(e){alert('לא ניתן לפתוח את הקובץ');}
}

      '<div><label>מתחלק בין (הקישו כדי להחריג מישהו)</label><div class="split-chips" id="ex-split">'+
        CREW.map(n=>'<button type="button" class="sp-chip" data-n="'+n+'" onclick="this.classList.toggle(\'off\')">'+n+'</button>').join('')+'</div></div>'+
      '<div><label>הערות (לא חובה)</label><input id="ex-note" type="text" placeholder="פרטים"></div>'+
      '<button class="ex-add" onclick="addExpense()">הוסף הוצאה</button></div></div>'+
    '<div id="ex-list"></div>';
  renderExpensesList();
}
function computeSettlement(){
  const bal={};CREW.forEach(n=>bal[n]=0);
  EXP.forEach(e=>{const gel=toGEL(e.amt,e.cur);const split=(e.split&&e.split.length)?e.split:CREW;const share=gel/split.length;
    if(e.payer&&bal[e.payer]!==undefined)bal[e.payer]+=gel;
    split.forEach(p=>{if(bal[p]!==undefined)bal[p]-=share;});});
  const creditors=[],debtors=[];
  Object.keys(bal).forEach(n=>{const v=Math.round(bal[n]);if(v>0.5)creditors.push({n,v});else if(v<-0.5)debtors.push({n,v:-v});});
  creditors.sort((a,b)=>b.v-a.v);debtors.sort((a,b)=>b.v-a.v);
  const tx=[];let i=0,j=0;
  while(i<debtors.length&&j<creditors.length){const pay=Math.min(debtors[i].v,creditors[j].v);
    if(pay>0.5)tx.push({from:debtors[i].n,to:creditors[j].n,amt:Math.round(pay)});
    debtors[i].v-=pay;creditors[j].v-=pay;if(debtors[i].v<0.5)i++;if(creditors[j].v<0.5)j++;}
  return {bal,tx};
}
function renderSettlement(){
  const box=document.getElementById('ex-settle');if(!box)return;
  if(!EXP.length){box.innerHTML='<div style="color:var(--dim);font-size:13px">הוסיפו הוצאות כדי לראות מי חייב למי 💸</div>';return;}
  const {bal,tx}=computeSettlement();
  let bhtml='<div class="bal-row">';
  CREW.forEach(n=>{const v=Math.round(bal[n]);if(Math.abs(v)<1)return;
    bhtml+='<span class="bal '+(v>0?'pos':'neg')+'">'+n+' '+(v>0?'+':'')+v+' ₾</span>';});
  bhtml+='</div>';
  let thtml='';
  if(!tx.length)thtml='<div style="color:var(--lime);font-weight:700;font-size:14px;margin-top:10px">הכל מאוזן ✨</div>';
  else thtml='<div style="margin-top:12px">'+tx.map(t=>'<div class="tx-row"><span class="tx-from">'+t.from+'</span><span class="tx-arr">←</span><span class="tx-to">'+t.to+'</span><span class="tx-amt">'+t.amt+' ₾ <span style="color:var(--dim);font-weight:600">(≈'+rd(t.amt*RATE_ILS)+' ₪)</span></span></div>').join('')+'</div>';
  box.innerHTML=bhtml+thtml+'<div style="font-size:11px;color:var(--dim);margin-top:10px">כל החישוב בלארי (₾). ירוק = מגיע לו כסף · אדום = חייב.</div>';
}
async function addExpense(){
  expLoaded=true;
  const desc=document.getElementById('ex-desc').value.trim();
  const date=document.getElementById('ex-date').value;
  const amt=parseFloat(document.getElementById('ex-amt').value);
  const cur=document.getElementById('ex-cur').value;
  const note=document.getElementById('ex-note').value.trim();
  const payer=document.getElementById('ex-payer').value;
  const split=[].slice.call(document.querySelectorAll('#ex-split .sp-chip')).filter(c=>!c.classList.contains('off')).map(c=>c.getAttribute('data-n'));
  if(!desc||isNaN(amt)){alert('נא למלא לפחות הוצאה וסכום');return;}
  if(!split.length){alert('בחרו לפחות אדם אחד לחלוקה');return;}
  EXP.push({id:'e'+Date.now()+Math.floor(Math.random()*999),desc,date,amt,cur,note,payer,split});
  await Store.set('ge_expenses',JSON.stringify(EXP));
  document.getElementById('ex-desc').value='';document.getElementById('ex-amt').value='';document.getElementById('ex-note').value='';
  [].slice.call(document.querySelectorAll('#ex-split .sp-chip')).forEach(c=>c.classList.remove('off'));
  renderExpensesList();
}
async function delExpense(id){EXP=EXP.filter(e=>e.id!==id);await Store.set('ge_expenses',JSON.stringify(EXP));renderExpensesList();}
function renderExpensesList(){
  const list=document.getElementById('ex-list');if(!list){renderSettlement&&renderSettlement();return;}
  if(!EXP.length){list.innerHTML='<div class="ex-empty">עדיין לא נרשמו הוצאות 💸<br>הוסיפו את ההוצאה הראשונה למעלה.</div>';}
  else{const sorted=[...EXP].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    list.innerHTML=sorted.map(e=>{const dd=e.date?e.date.slice(8,10)+'/'+e.date.slice(5,7):'—';
      const meta=(e.payer?'שילם: '+e.payer:'')+(e.split&&e.split.length&&e.split.length<CREW.length?' · מתחלק בין '+e.split.length:'')+(e.note?' · '+e.note:'');
      return '<div class="ex-row"><div class="exdt">'+dd+'</div><div class="exmid"><div class="exnm">'+e.desc+'</div>'+(meta?'<div class="exnote">'+meta+'</div>':'')+'</div>'+
        '<div class="examt">'+e.amt+' '+e.cur+'</div><button class="exdel" onclick="delExpense(\''+e.id+'\')">✕</button></div>';}).join('');}
  const totalGEL=EXP.reduce((s,e)=>s+toGEL(e.amt,e.cur),0);
  const tg=document.getElementById('ex-total-gel'),ti=document.getElementById('ex-total-ils');
  if(tg)tg.textContent=rd(totalGEL).toLocaleString('en-US')+' ₾';
  if(ti)ti.textContent='≈ '+rd(totalGEL*RATE_ILS).toLocaleString('en-US')+' ₪';
  renderSettlement();
}
async function initExpenses(){try{const raw=await Store.get('ge_expenses');if(expLoaded)return;EXP=raw?JSON.parse(raw):[];}catch(e){if(!expLoaded)EXP=[];}expLoaded=true;renderExpensesList();}
async function loadRate(){try{const r=await fetch('https://open.er-api.com/v6/latest/GEL');if(!r.ok)throw 0;const j=await r.json();
  if(j&&j.rates){if(j.rates.ILS)RATE_ILS=j.rates.ILS;if(j.rates.USD)RATE_USD=j.rates.USD;renderExpensesList();}}catch(e){}}

function switchTab(name){
  document.querySelectorAll('.view').forEach(el=>el.classList.toggle('on',el.id==='view-'+name));
  document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.v===name;t.classList.toggle('active',on);
    if(on&&t.scrollIntoView)t.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});});
  if(name==='map'){renderMap();setTimeout(()=>{if(leafMap)leafMap.invalidateSize();},120);}
  window.scrollTo({top:0,behavior:'smooth'});
}

renderCrewChips();renderPlan();renderNight();renderFun();renderStay();renderFlights();renderExpenses();renderInfo();
initExpenses();loadRate();
tick();setInterval(tick,1000);
</script>
